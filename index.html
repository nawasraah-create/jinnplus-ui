<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3rb.io — Multibox</title>
    
    <!-- External Fonts & Icons -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css" crossorigin="anonymous">
    <link href="https://netdna.bootstrapcdn.com/font-awesome/3.2.1/css/font-awesome.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Oswald:300,400|Raleway:300,400,500|Ubuntu:400,500,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Socket.IO - Updated to latest version -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Ubuntu', sans-serif;
            background: #111;
            overflow: hidden;
        }
        
        #canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        #menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        #player-data {
            background: rgba(30,30,30,0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 90%;
        }
        
        .inputs-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .menu-inputs {
            width: 100%;
            padding: 15px;
            background: rgba(50,50,50,0.8);
            border: 2px solid rgba(102,126,234,0.3);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-family: 'Ubuntu', sans-serif;
            transition: all 0.3s;
        }
        
        .menu-inputs:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(60,60,60,0.9);
        }
        
        .menu-inputs::placeholder {
            color: rgba(255,255,255,0.4);
        }
        
        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102,126,234,0.4);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        #button-spectate {
            background: rgba(255,255,255,0.1);
        }
        
        #button-spectate:hover {
            background: rgba(255,255,255,0.2);
        }
        
        /* HUD Elements */
        #huds {
            position: fixed;
            pointer-events: none;
            z-index: 100;
        }
        
        #leaderboard-hud {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            min-width: 200px;
            color: white;
            font-family: 'Ubuntu', sans-serif;
        }
        
        #leaderboard-head {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            color: #667eea;
        }
        
        #stats-hud {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }
        
        #minimap-hud {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 200px;
            height: 200px;
            background: rgba(0,0,0,0.7);
            border: 2px solid rgba(102,126,234,0.3);
            border-radius: 10px;
        }
        
        .hidden {
            display: none !important;
        }
        
        /* Loading Animation */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .fade-in {
            animation: fadeIn 0.5s;
        }
    </style>
</head>
<body>
    <div id="admin_message"></div>
    
    <!-- HUD Elements -->
    <div id="huds">
        <div id="leaderboard-hud">
            <div id="leaderboard-head">Leaderboard</div>
            <div id="leaderboard-positions"></div>
        </div>
        
        <div id="stats-hud">
            <i class="fa fa-signal" aria-hidden="true"></i>
            <span id="stats-text">Ready</span>
        </div>
        
        <div id="minimap-hud">
            <canvas id="minimap-canvas" width="200" height="200"></canvas>
        </div>
    </div>

    <!-- Menu Overlay -->
    <div id="menu-overlay">
        <div id="player-data">
            <div class="inputs-box">
                <input class="menu-inputs" id="nick" placeholder="Nick" maxlength="15">
                <input class="menu-inputs" id="skin" placeholder="Skin URL (اختياري)">
                
                <select class="menu-inputs" id="servers">
                    <option value="">Connecting to servers...</option>
                </select>
                
                <button id="button-play">
                    <i class="fa fa-play"></i> Play
                </button>
                <button id="button-spectate">
                    <i class="fa fa-eye"></i> Spectate
                </button>
            </div>
        </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="canvas"></canvas>

    <script>
        // ============================================
        // Configuration & Global Variables
        // ============================================
        const config = {
            serverUrl: 'wss://3rb.io',  // تحديث: استخدام websocket الحالي
            defaultServer: 'eu-server-1',
            canvas: document.getElementById('canvas'),
            ctx: null,
            socket: null,
            gameRunning: false,
            playerNick: '',
            playerSkin: '',
            cells: new Map(),
            food: [],
            viruses: [],
            mouseX: 0,
            mouseY: 0,
            viewportX: 0,
            viewportY: 0,
            viewportScale: 1,
        };

        // ============================================
        // Initialize Canvas
        // ============================================
        function initCanvas() {
            config.canvas.width = window.innerWidth;
            config.canvas.height = window.innerHeight;
            config.ctx = config.canvas.getContext('2d');
            
            window.addEventListener('resize', () => {
                config.canvas.width = window.innerWidth;
                config.canvas.height = window.innerHeight;
            });
        }

        // ============================================
        // Server Connection
        // ============================================
        function loadServers() {
            const serverSelect = document.getElementById('servers');
            
            // قائمة سيرفرات 3rb.io الحالية
            const servers = [
                { name: 'Europe - Main', value: 'eu-1', url: 'wss://3rb.io' },
                { name: 'Europe - 2', value: 'eu-2', url: 'wss://eu2.3rb.io' },
                { name: 'Auto Select', value: 'auto', url: 'wss://3rb.io' }
            ];
            
            serverSelect.innerHTML = '';
            servers.forEach(server => {
                const option = document.createElement('option');
                option.value = server.url;
                option.textContent = server.name;
                serverSelect.appendChild(option);
            });
            
            // Select default
            serverSelect.value = servers[0].url;
        }

        // ============================================
        // Socket.IO Connection
        // ============================================
        function connectToServer(serverUrl) {
            console.log('🔌 Connecting to:', serverUrl);
            
            // إنشاء اتصال Socket.IO بالسيرفر الحقيقي
            config.socket = io(serverUrl, {
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionDelay: 1000,
                reconnectionAttempts: 5
            });

            // Event: Connection Success
            config.socket.on('connect', () => {
                console.log('✅ Connected to server!');
                document.getElementById('stats-text').textContent = 'Connected';
                config.gameRunning = true;
                
                // إرسال معلومات اللاعب للسيرفر
                config.socket.emit('player-join', {
                    nick: config.playerNick,
                    skin: config.playerSkin
                });
            });

            // Event: Connection Error
            config.socket.on('connect_error', (error) => {
                console.error('❌ Connection error:', error);
                document.getElementById('stats-text').textContent = 'Connection Failed';
            });

            // Event: Disconnect
            config.socket.on('disconnect', () => {
                console.log('🔌 Disconnected from server');
                document.getElementById('stats-text').textContent = 'Disconnected';
                config.gameRunning = false;
            });

            // Event: Game Data من السيرفر
            config.socket.on('game-update', (data) => {
                updateGameState(data);
            });

            // Event: Leaderboard Update
            config.socket.on('leaderboard', (data) => {
                updateLeaderboard(data);
            });
        }

        // ============================================
        // Game State Management
        // ============================================
        function updateGameState(data) {
            if (!data) return;
            
            // تحديث الخلايا
            if (data.cells) {
                config.cells = new Map(Object.entries(data.cells));
            }
            
            // تحديث الطعام
            if (data.food) {
                config.food = data.food;
            }
            
            // تحديث الفيروسات
            if (data.viruses) {
                config.viruses = data.viruses;
            }
        }

        function updateLeaderboard(players) {
            const container = document.getElementById('leaderboard-positions');
            container.innerHTML = '';
            
            players.slice(0, 10).forEach((player, index) => {
                const div = document.createElement('div');
                div.style.cssText = 'padding: 5px 0; color: white; font-size: 13px;';
                div.textContent = `${index + 1}. ${player.nick || 'Anonymous'} - ${player.mass || 0}`;
                container.appendChild(div);
            });
        }

        // ============================================
        // Game Rendering
        // ============================================
        function render() {
            if (!config.ctx) return;
            
            const ctx = config.ctx;
            const w = config.canvas.width;
            const h = config.canvas.height;
            
            // Clear canvas
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, w, h);
            
            // Draw grid
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = 0; x < w; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            }
            for (let y = 0; y < h; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
                ctx.stroke();
            }
            
            // Draw food
            config.food.forEach(f => {
                ctx.fillStyle = f.color || '#FF6B6B';
                ctx.beginPath();
                ctx.arc(f.x, f.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Draw cells
            config.cells.forEach(cell => {
                ctx.fillStyle = cell.color || '#667eea';
                ctx.beginPath();
                ctx.arc(cell.x, cell.y, cell.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw nick
                if (cell.nick) {
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 14px Ubuntu';
                    ctx.textAlign = 'center';
                    ctx.fillText(cell.nick, cell.x, cell.y);
                }
            });
            
            requestAnimationFrame(render);
        }

        // ============================================
        // Controls
        // ============================================
        function initControls() {
            // Mouse movement
            document.addEventListener('mousemove', (e) => {
                config.mouseX = e.clientX;
                config.mouseY = e.clientY;
                
                if (config.socket && config.gameRunning) {
                    config.socket.emit('mouse', {
                        x: config.mouseX,
                        y: config.mouseY
                    });
                }
            });
            
            // Keyboard controls
            document.addEventListener('keydown', (e) => {
                if (!config.socket || !config.gameRunning) return;
                
                switch(e.key.toLowerCase()) {
                    case 'w':
                        config.socket.emit('eject');
                        break;
                    case ' ':
                        config.socket.emit('split');
                        break;
                    case 'e':
                        config.socket.emit('split');
                        setTimeout(() => config.socket.emit('split'), 50);
                        break;
                }
            });
        }

        // ============================================
        // UI Handlers
        // ============================================
        document.getElementById('button-play').addEventListener('click', () => {
            config.playerNick = document.getElementById('nick').value || 'Anonymous';
            config.playerSkin = document.getElementById('skin').value || '';
            
            const serverUrl = document.getElementById('servers').value;
            
            if (!serverUrl) {
                alert('Please select a server!');
                return;
            }
            
            // Hide menu
            document.getElementById('menu-overlay').style.display = 'none';
            
            // Connect to server
            connectToServer(serverUrl);
            
            console.log('🎮 Starting game...');
        });

        document.getElementById('button-spectate').addEventListener('click', () => {
            config.playerNick = '';
            config.playerSkin = '';
            
            const serverUrl = document.getElementById('servers').value;
            document.getElementById('menu-overlay').style.display = 'none';
            connectToServer(serverUrl);
        });

        // ============================================
        // Initialization
        // ============================================
        window.addEventListener('load', () => {
            console.log('%c🎮 3rb.io Multibox Loaded!', 'color: #667eea; font-size: 16px; font-weight: bold;');
            
            initCanvas();
            loadServers();
            initControls();
            render();
            
            console.log('%c✅ Ready to play!', 'color: #4CAF50; font-size: 14px;');
        });
    </script>
</body>
</html>
