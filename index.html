<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JINN PLUS 3.0 - العب 3rb.io بأسلوب جديد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: #0f0f23;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* خلفية متحركة أنيميشن */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(125deg, #667eea 0%, #764ba2 40%, #f093fb 70%, #4facfe 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* تأثير الجزيئات */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Container اللعبة */
        #gameContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: none;
            background: rgba(0, 0, 0, 0.3);
        }

        #gameContainer.active {
            display: block;
        }

        #gameFrame {
            width: 100%;
            height: 100%;
            border: none;
            position: relative;
            z-index: 6;
        }

        /* واجهة البداية */
        #startUI {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        #startUI.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8) translateY(50px);
        }

        .main-box {
            background: rgba(15, 15, 35, 0.85);
            backdrop-filter: blur(30px) saturate(180%);
            border-radius: 30px;
            padding: 50px 40px;
            width: 90%;
            max-width: 550px;
            box-shadow: 
                0 30px 80px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            animation: floatIn 0.8s ease-out;
            position: relative;
            overflow: hidden;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(80px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* تأثير ضوئي */
        .main-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.15) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .main-box > * {
            position: relative;
            z-index: 2;
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo h1 {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #f093fb 50%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            letter-spacing: 3px;
            margin-bottom: 10px;
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { 
                filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.6));
            }
            50% { 
                filter: drop-shadow(0 0 40px rgba(240, 147, 251, 0.8));
            }
        }

        .logo p {
            font-size: 1.2rem;
            color: #b8c5ff;
            font-weight: 600;
            opacity: 0.9;
        }

        /* حقل الإدخال */
        .input-wrapper {
            margin-bottom: 25px;
        }

        .input-wrapper label {
            display: block;
            color: #b8c5ff;
            font-size: 1rem;
            margin-bottom: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #playerNameInput {
            width: 100%;
            padding: 18px 20px;
            border-radius: 16px;
            border: 2px solid rgba(102, 126, 234, 0.4);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1.2rem;
            font-family: 'Tajawal', sans-serif;
            text-align: center;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        #playerNameInput:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 0 30px rgba(102, 126, 234, 0.5),
                inset 0 0 20px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        #playerNameInput::placeholder {
            color: rgba(184, 197, 255, 0.5);
        }

        /* زر اللعب */
        .play-button {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Tajawal', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
        }

        .play-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .play-button:hover::before {
            left: 100%;
        }

        .play-button:hover {
            background: linear-gradient(135deg, #764ba2 0%, #f093fb 100%);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 50px rgba(118, 75, 162, 0.6);
        }

        .play-button:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* معلومات السيرفر */
        .server-info {
            margin-top: 30px;
            padding: 20px;
            background: rgba(102, 126, 234, 0.15);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 15px;
            text-align: center;
        }

        .server-info p {
            margin: 8px 0;
            font-size: 0.95rem;
            color: #b8c5ff;
            font-weight: 600;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(76, 175, 80, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            margin-top: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background: #4CAF50;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 0 10px #4CAF50;
        }

        @keyframes pulse {
            0%, 100% { 
                transform: scale(1);
                opacity: 1;
            }
            50% { 
                transform: scale(1.2);
                opacity: 0.7;
            }
        }

        /* HUD اللعب */
        #gameHUD {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 200;
            background: rgba(15, 15, 35, 0.9);
            backdrop-filter: blur(15px);
            padding: 20px 30px;
            border-radius: 20px;
            border: 1px solid rgba(102, 126, 234, 0.3);
            display: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        #gameHUD.active {
            display: block;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        #gameHUD h3 {
            color: #667eea;
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #gameHUD p {
            margin: 10px 0;
            color: #b8c5ff;
            font-weight: 600;
            font-size: 1rem;
        }

        #gameHUD span {
            color: #fff;
            font-weight: 900;
        }

        /* زر العودة */
        .back-button {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 12px 30px;
            border-radius: 25px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: none;
            font-family: 'Tajawal', sans-serif;
        }

        .back-button.active {
            display: block;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateX(-50%) translateY(-3px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo h1 {
                font-size: 3rem;
            }
            
            .main-box {
                padding: 40px 25px;
            }

            .play-button {
                font-size: 1.2rem;
            }

            #gameHUD {
                top: 10px;
                right: 10px;
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- الخلفية المتحركة -->
    <div class="animated-bg"></div>
    <canvas class="particles" id="particles"></canvas>

    <!-- Container اللعبة -->
    <div id="gameContainer">
        <iframe id="gameFrame" src="" allow="autoplay; fullscreen"></iframe>
    </div>

    <!-- واجهة البداية -->
    <div id="startUI">
        <div class="main-box">
            <div class="logo">
                <h1>JINN PLUS</h1>
                <p>✨ تجربة لعب فريدة من نوعها</p>
            </div>

            <div class="input-wrapper">
                <label for="playerNameInput">🎮 اسم اللاعب</label>
                <input 
                    type="text" 
                    id="playerNameInput" 
                    placeholder="أدخل اسمك هنا..."
                    maxlength="15"
                    autocomplete="off"
                />
            </div>

            <button class="play-button" onclick="startGame()">
                ▶️ ابدأ اللعب الآن
            </button>

            <div class="server-info">
                <p>🌐 متصل بسيرفرات 3rb.io الرسمية</p>
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span>السيرفر متاح</span>
                </div>
                <p style="margin-top: 15px; font-size: 0.85rem; opacity: 0.7;">
                    💡 استخدم Tampermonkey للاتصال الكامل
                </p>
            </div>
        </div>
    </div>

    <!-- HUD أثناء اللعب -->
    <div id="gameHUD">
        <h3>📊 إحصائيات اللعب</h3>
        <p>اللاعب: <span id="hudPlayerName">-</span></p>
        <p>الحالة: <span id="hudStatus">متصل</span></p>
    </div>

    <!-- زر العودة -->
    <button class="back-button" id="backButton" onclick="showMenu()">
        ← العودة للقائمة (ESC)
    </button>

    <script>
        // ============================================
        // رسم الجزيئات المتحركة
        // ============================================
        
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.size = Math.random() * 3 + 1;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.fillStyle = `rgba(102, 126, 234, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const particles = [];
        for (let i = 0; i < 80; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animateParticles);
        }

        animateParticles();

        // ============================================
        // دالة بدء اللعب
        // ============================================
        
        function startGame() {
            const nameInput = document.getElementById('playerNameInput');
            const playerName = nameInput.value.trim();

            if (!playerName) {
                nameInput.focus();
                nameInput.style.borderColor = '#f44336';
                setTimeout(() => {
                    nameInput.style.borderColor = 'rgba(102, 126, 234, 0.4)';
                }, 1000);
                return;
            }

            // حفظ الاسم
            localStorage.setItem('jinnPlayerName', playerName);

            // تحديث HUD
            document.getElementById('hudPlayerName').textContent = playerName;

            // إخفاء القائمة
            document.getElementById('startUI').classList.add('hidden');
            
            // إظهار اللعبة
            setTimeout(() => {
                const gameContainer = document.getElementById('gameContainer');
                const gameFrame = document.getElementById('gameFrame');
                
                gameContainer.classList.add('active');
                gameFrame.src = 'https://3rb.io/';
                
                document.getElementById('gameHUD').classList.add('active');
                document.getElementById('backButton').classList.add('active');
            }, 600);

            // إرسال حدث للـ Tampermonkey
            window.dispatchEvent(new CustomEvent('jinnGameStart', {
                detail: { playerName: playerName }
            }));

            console.log('%c🎮 JINN PLUS - Game Started!', 'color: #667eea; font-size: 16px; font-weight: bold;');
            console.log('Player:', playerName);
        }

        // ============================================
        // دالة العودة للقائمة
        // ============================================
        
        function showMenu() {
            document.getElementById('startUI').classList.remove('hidden');
            document.getElementById('gameContainer').classList.remove('active');
            document.getElementById('gameHUD').classList.remove('active');
            document.getElementById('backButton').classList.remove('active');
        }

        // ============================================
        // ESC للعودة
        // ============================================
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const startUI = document.getElementById('startUI');
                if (startUI.classList.contains('hidden')) {
                    showMenu();
                }
            }
        });

        // Enter للعب
        document.getElementById('playerNameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                startGame();
            }
        });

        // ============================================
        // تحميل الاسم المحفوظ
        // ============================================
        
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('jinnPlayerName');
            if (savedName) {
                document.getElementById('playerNameInput').value = savedName;
            }
        });

        console.log('%c🎨 JINN PLUS v3.0 - Ready!', 'color: #f093fb; font-size: 18px; font-weight: bold;');
        console.log('%c📡 Waiting for Tampermonkey connection...', 'color: #4facfe;');
    </script>

</body>
</html>
