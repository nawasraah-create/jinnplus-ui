<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3rb.io - Modified</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            height: 100vh;
        }
        
        #gameContainer {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        
        #gameFrame {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        
        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: white;
            font-size: 24px;
            margin-top: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        #controls {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            z-index: 1000;
            max-width: 300px;
        }
        
        #controls h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        #controls p {
            font-size: 12px;
            margin: 5px 0;
            opacity: 0.9;
        }
        
        .status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-left: 5px;
        }
        
        .status.connected {
            background: #4CAF50;
            box-shadow: 0 0 10px #4CAF50;
        }
        
        .status.disconnected {
            background: #f44336;
            box-shadow: 0 0 10px #f44336;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            width: 100%;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        #closeControls {
            background: rgba(255,255,255,0.2);
            padding: 5px 10px;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div class="loader"></div>
        <div class="loading-text">جاري تحميل اللعبة...</div>
    </div>
    
    <div id="controls">
        <h3>🎮 لوحة التحكم</h3>
        <p>الحالة: <span class="status connected"></span> متصل</p>
        <p>السيرفر: GitHub Custom</p>
        <p>الوضع: Multiplayer جاهز</p>
        <button onclick="reloadGame()">🔄 إعادة تحميل</button>
        <button id="closeControls" onclick="toggleControls()">إخفاء</button>
    </div>
    
    <div id="gameContainer">
        <iframe id="gameFrame" src="https://3rb.io"></iframe>
    </div>

    <script>
        // إخفاء شاشة التحميل بعد تحميل اللعبة
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loadingScreen').classList.add('hidden');
            }, 2000);
        });

        // إعادة تحميل اللعبة
        function reloadGame() {
            document.getElementById('gameFrame').src = document.getElementById('gameFrame').src;
            document.getElementById('loadingScreen').classList.remove('hidden');
            setTimeout(function() {
                document.getElementById('loadingScreen').classList.add('hidden');
            }, 2000);
        }

        // إظهار/إخفاء لوحة التحكم
        let controlsVisible = true;
        function toggleControls() {
            const controls = document.getElementById('controls');
            if (controlsVisible) {
                controls.style.transform = 'translateX(320px)';
                setTimeout(() => {
                    controls.innerHTML = '<button onclick="toggleControls()" style="padding: 5px 10px; font-size: 12px;">📋 إظهار</button>';
                    controls.style.transform = 'translateX(0)';
                }, 300);
            } else {
                location.reload();
            }
            controlsVisible = !controlsVisible;
        }

        // مراقبة حالة الاتصال
        setInterval(function() {
            const iframe = document.getElementById('gameFrame');
            const status = document.querySelector('.status');
            
            try {
                if (iframe.contentWindow) {
                    status.classList.add('connected');
                    status.classList.remove('disconnected');
                }
            } catch(e) {
                // اللعبة في domain مختلف، هذا طبيعي
                status.classList.add('connected');
                status.classList.remove('disconnected');
            }
        }, 3000);

        // رسالة ترحيب في الكونسول
        console.log('%c🎮 3rb.io Modified Version', 'color: #667eea; font-size: 20px; font-weight: bold;');
        console.log('%c✅ تم التحميل بنجاح من GitHub!', 'color: #4CAF50; font-size: 14px;');
    </script>
</body>
</html>
