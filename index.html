<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JINN PLUS - MODERN UI</title>
    <style>
        /* [الستايلات كاملة للتصميم الجديد] */
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        
        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #E0E0E0;
            overflow: hidden;
            background: linear-gradient(135deg, #1A1A2E, #0F0F1A);
            position: relative;
        }

        /* خلفية جميلة مع ضبابية */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1542385108-c84119d27039');
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            filter: blur(3px);
        }

        /* حاوية Glassmorphism */
        .main-container {
            position: relative;
            z-index: 10;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 40px;
            width: 90%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .header {
            grid-column: 1 / -1;
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 3.5rem;
            color: #FFC300;
            text-shadow: 0 0 10px #FFC300, 0 0 20px rgba(255, 195, 0, 0.5);
            letter-spacing: 5px;
            margin: 0;
        }

        .game-section, .social-section {
            padding: 20px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.05);
        }

        .section-title {
            font-size: 1.5rem;
            color: #FFD700;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 10px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            display: block;
        }

        .btn-primary {
            background-color: #FFC300;
            color: #1A1A2E;
        }

        .btn-primary:hover {
            background-color: #FFD700;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 6px 20px rgba(255, 195, 0, 0.4);
        }

        .btn-secondary {
            background-color: transparent;
            color: #E0E0E0;
            border: 2px solid #555;
        }

        .btn-secondary:hover {
            border-color: #FFC300;
            color: #FFC300;
            background-color: rgba(255, 195, 0, 0.1);
            transform: translateY(-2px);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
        }

        .social-link {
            font-size: 2rem;
            color: #E0E0E0;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .social-link:hover {
            color: #FFC300;
            transform: scale(1.15);
        }

        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="main-container">

        <h1>JINN PLUS 2.0</h1>
        <p style="color: #FFD700;">الواجهة السلسة الجديدة</p>
    </div>
    
    <div class="game-section">
