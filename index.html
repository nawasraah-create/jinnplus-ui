<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3rb.io Arabic Enhancer — HUD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ae-hud" dir="rtl" style="pointer-events:auto;">
    <header>
      <h2>🔥 3rb.io النسخة المحسّنة</h2>
      <div id="ae-controls">
        <button data-skin="none">السكن الافتراضي</button>
        <button data-skin="skin1">سكن 1</button>
        <button data-skin="skin2">سكن 2</button>
        <select id="ae-map-theme">
          <option value="default">خريطة: افتراضي</option>
          <option value="night">ثيم ليلي</option>
          <option value="colorful">خلفية ملونة</option>
        </select>
      </div>
    </header>

    <section id="ae-stats">
      <div>FPS: <span id="ae-fps">--</span></div>
      <div>Ping: <span id="ae-ping">N/A</span></div>
    </section>

    <section id="ae-effects">
      <button id="ae-kill">شغل مؤثر Kill</button>
      <button id="ae-win">شغل مؤثر Win</button>
    </section>

    <footer>
      <label><input type="checkbox" id="ae-overlay-toggle" checked> اظهار الـ HUD</label>
      <small>تصميم عربي — خصائص تجميلية فقط</small>
    </footer>
  </div>

  <!-- عنصر سكن بسيط يتبع الفأرة (تصويري فقط) -->
  <img id="ae-skin-overlay" src="assets/skin1.png" style="position:fixed;left:0;top:0;width:48px;height:48px;pointer-events:none;display:none;z-index:9999" alt="skin">

  <script src="main.js"></script>
</body>
</html>
